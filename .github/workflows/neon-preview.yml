name: PostgreSQL PR tests

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: postgres-pr-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: geevheit_ci
          POSTGRES_PASSWORD: geevheit_ci
          POSTGRES_DB: geevheit_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U geevheit_ci -d geevheit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Migrate empty database
        working-directory: api
        env:
          DATABASE_URL: postgres://geevheit_ci:geevheit_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/geevheit_ci?sslmode=disable
        run: go run ./cmd/migrate
      - name: Test persistence and tenant isolation
        working-directory: api
        env:
          TEST_DATABASE_URL: postgres://geevheit_ci:geevheit_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/geevheit_ci?sslmode=disable
        run: go test -v ./...
